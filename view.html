<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>じゃんけんクエスト（表示切りかえ）</title>
<link rel="icon" href="icon-192.png">
<style>
  /* ゲームをスマホ幅・PC幅の枠の中で開いて、画面の幅に関係なくスマホ版・PC版を見られるようにする */
  html, body { margin: 0; height: 100%; background: #0c0f22; color: #a9b0cf; font-family: system-ui, sans-serif; overflow: hidden; }
  .bar { position: fixed; top: 0; left: 0; right: 0; height: 32px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; z-index: 2; }
  .bar b { color: #f5b942; }
  .stage { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; }
  .box { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%; box-shadow: 0 0 0 3px #22204a, 0 12px 40px #000c; border-radius: 18px; overflow: hidden; background: #151a33; }
  .box.pc { border-radius: 6px; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="bar">表示：<b id="label"></b><span>（Ctrl+M で切りかえ：スマホ版 → PC版 → 自動）</span></div>
<div class="stage"><div class="box" id="box"><iframe id="game" src="index.html" title="じゃんけんクエスト"></iframe></div></div>
<script>
  const SIZE = { phone: [390, 844], pc: [1366, 860] }, LABEL = { phone: "スマホ版", pc: "PC版" }, ORDER = ["auto", "phone", "pc"];
  const getMode = () => { try { return localStorage.getItem("jq-view") || "auto"; } catch { return "auto"; } };
  function layout() {
    const m = getMode();
    if (!SIZE[m]) { location.replace("index.html"); return; }   // 自動に戻したら、ふつうのページへ
    const [w, h] = SIZE[m], box = document.getElementById("box");
    const sc = Math.min(1, (innerWidth - 16) / w, (innerHeight - 48) / h);  // 入りきらないときは縮めて全体を見せる
    box.className = "box " + m; box.style.width = w + "px"; box.style.height = h + "px"; box.style.transform = `translate(-50%, -50%) scale(${sc})`; // 縮めても真ん中に
    document.getElementById("label").textContent = LABEL[m] + (sc < 1 ? `（${Math.round(sc * 100)}%に縮小）` : "");
  }
  function next() {
    const n = ORDER[(ORDER.indexOf(getMode()) + 1) % ORDER.length];
    try { localStorage.setItem("jq-view", n); } catch {}
    layout();
  }
  addEventListener("keydown", ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "m") { ev.preventDefault(); next(); } });
  addEventListener("message", ev => { if (ev.origin === location.origin && ev.data === "jq-view-next") next(); });  // ゲームの中で押したとき
  addEventListener("resize", layout);
  layout();
</script>
</body>
</html>
