<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャラモーション確認</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #151a33; color: #f4ecdc; }
body { margin: 0; } main { max-width: 1120px; margin: auto; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 8px; } p { line-height: 1.7; color: #bac2df; margin: 0 0 20px; }
.controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
select, button { font: inherit; padding: 9px 12px; border: 1px solid #54618d; border-radius: 8px; color: #f4ecdc; background: #283259; }
button { cursor: pointer; } label { display: flex; align-items: center; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.card { background: #1f2747; border: 1px solid #3a4675; border-radius: 12px; padding: 12px; text-align: center; }
h2 { font-size: 15px; margin: 0 0 6px; } .scene { height: 200px; position: relative; background: #2a3460; border-radius: 8px; overflow: hidden; }
.light .scene { background: #efe5ce; }
.actor { position: absolute; width: 128px; height: 160px; bottom: 12px; left: calc(50% - 64px); }
.bob { position: absolute; inset: 0; animation: breathe 2.4s steps(1, end) infinite; }
.motion-rendered .bob { animation: none; }
.spr { display: block; width: 128px; height: 160px; max-width: none; image-rendering: pixelated; }
.shadow { position: absolute; width: 64px; height: 8px; left: 32px; bottom: -3px; border-radius: 50%; background: #0004; }
.bubble { position: absolute; top: 50px; right: 8px; border-radius: 50%; background: #f4ecdc; border: 2px solid #22204a; padding: 5px; z-index: 2; }
.bubble img { width: 24px; height: 24px; display: block; image-rendering: pixelated; }
@keyframes breathe { 0%, 100% { transform: translateY(0); } 35%, 65% { transform: translateY(-1px); } }
.caption { margin: 16px 0 0; font-size: 13px; } .card button { margin-top: 10px; font-size: 13px; }
@media (max-width: 520px) { main { padding: 16px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .controls { font-size: 14px; } }
</style>
</head>
<body><main>
<h1>キャラモーション確認</h1>
<p>参考画像に合わせた全身のコマ送りモーションです。腕・脚・表情・手の形が変わります。各ボタンで動きを確認できます。</p>
<div class="controls">
  <label>キャラ <select id="character"></select></label>
  <button id="replay" type="button">全部再生</button>
  <label><input id="light" type="checkbox">明るい背景</label>
  <label><input id="reverse" type="checkbox">相手側の向き</label>
  <label><input id="fast" type="checkbox">演出：速い</label>
</div>
<div class="grid" id="list"></div>
<p class="caption" id="status" role="status"></p>
</main>
<script src="art.js"></script>
<script src="character-atlases.js?v=2026-11-08-0044"></script>
<script src="character-motion.js?v=2026-11-08-0044"></script>
<script>
const names = ["テツ", "キリ", "ハル", "ゴン", "レン", "ナギ", "ガロウ", "イワオ", "カゲ", "シズク", "ツツミ", "ウガチ", "ホムラ", "マサ", "トキ", "ミツ", "セツナ", "カエデ（攻撃）", "カエデ（防御）"];
const keys = [...Array.from({ length: 18 }, (_, i) => `c${i + 1}`), "c18d"];
const motions = [["待機・まばたき", "idle"], ["走り", "run"], ["じゃんけん・グー", "G", 0], ["じゃんけん・チョキ", "C", 1], ["じゃんけん・パー", "P", 2], ["ジャンプ", "jump"], ["ダメージ", "hurt"], ["勝利", "win"], ["敗北", "lose"]];
const select = document.getElementById("character"), cards = [];
keys.forEach((key, i) => { const option = document.createElement("option"); option.value = key; option.textContent = names[i]; select.append(option); });
for (const [label, name, hand] of motions) {
  const card = document.createElement("section"); card.className = "card";
  card.innerHTML = `<h2>${label}</h2><div class="scene"><div class="actor"><div class="shadow"></div><div class="bob"><img class="spr" alt="${label}"></div></div></div><button type="button">再生：${label}</button>`;
  const actor = card.querySelector(".actor");
  if (hand !== undefined) { const bubble = document.createElement("span"); bubble.className = "bubble"; bubble.innerHTML = `<img src="${JQArt.handIcon(hand)}" alt="${["グー", "チョキ", "パー"][hand]}">`; card.querySelector(".scene").append(bubble); }
  const play = () => JQMotion.play(actor, name, { loop: name === "win" || name === "run", rate: document.getElementById("fast").checked ? .55 : 1 });
  card.querySelector("button").onclick = play;
  cards.push({ actor, play }); document.getElementById("list").append(card);
}
async function choose() {
  const key = select.value;
  document.getElementById("status").textContent = "読み込み中…";
  const ready = cards.map(async ({ actor }) => {
    JQMotion.play(actor, "idle");
    const image = actor.querySelector(".spr"); image.dataset.motionKey = key; image.src = `img/chars/${key}.png?v=2026-11-08-0044`;
    await image.decode();
  });
  try {
    await Promise.all(ready); if (select.value !== key) return;
    cards.forEach(c => c.play());
    document.getElementById("status").textContent = `${names[keys.indexOf(key)]}：9種類・36コマのモーションを使用しています。`;
  } catch { if (select.value === key) document.getElementById("status").textContent = "画像を読み込めませんでした。再読み込みしてください。"; }
}
select.onchange = choose;
document.getElementById("replay").onclick = () => cards.forEach(c => c.play());
document.getElementById("light").onchange = e => document.body.classList.toggle("light", e.target.checked);
document.getElementById("reverse").onchange = e => cards.forEach(c => { c.actor.style.transform = e.target.checked ? "scaleX(-1)" : "none"; });
document.getElementById("fast").onchange = () => cards.forEach(c => c.play());
choose();
</script></body></html>
