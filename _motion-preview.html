<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>動きの見本</title>
<style>
:root { --night: #151a33; --panel: #1f2747; --line: #3a4675; --ink: #f4ecdc; --dim: #a9b0cf; --gold: #ffd166; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: "M PLUS Rounded 1c", system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.2rem; margin: 0 0 4px; }
.sub { color: var(--dim); font-size: .85rem; margin: 0 0 14px; }
.row { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; flex-wrap: wrap; }
.row b { width: 52px; font-size: .9rem; }
.cell { display: flex; flex-direction: column; align-items: center; font-size: .72rem; color: var(--dim); }
canvas { width: 128px; height: 160px; image-rendering: pixelated; background: #2a3460; border-radius: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>今の立ち絵から、プログラムで動きを付けた見本</h1>
  <p class="sub">絵は描き直さず、立ち絵をドット単位でずらしたり、色を変えたり、手のドット絵を重ねたりして動かしています。</p>
  <div id="list"></div>
</div>
<script src="art.js"></script>
<script>
const NAMES = ["テツ", "キリ", "ハル", "ゴン", "レン", "ナギ", "ガロウ", "イワオ", "カゲ"];
const MOTIONS = [["待機", 4, 380], ["ぽん！", 3, 700], ["ダメージ", 4, 120], ["勝ち", 4, 160], ["負け", 3, 420]];
const W = 256, H = 320;
const load = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = src; });
// 1コマを描く：img を元に、動きの種類と番号に合わせて行ごとにずらす
function frame(g, img, hands, kind, k) {
  g.clearRect(0, 0, W, H);
  const waist = H * .56, hair = H * .24;
  if (kind === "待機") {
    const dy = [0, 2, 4, 2][k], dx = [0, 2, 0, -2][k];
    g.drawImage(img, 0, waist, W, H - waist, 0, waist, W, H - waist);            // 下半身はそのまま
    g.drawImage(img, 0, hair, W, waist - hair, 0, hair + dy, W, waist - hair);   // 上半身は沈む
    g.drawImage(img, 0, 0, W, hair, dx, dy, W, hair);                            // 髪は少し揺れる
  } else if (kind === "ぽん！") {
    g.drawImage(img, 0, 0);
    const h = hands[k], s = 64; g.drawImage(h, W * .62, H * .5 - s / 2, s, s);   // 前に出した手
  } else if (kind === "ダメージ") {
    const lean = [0, 14, 10, 4][k];
    for (let y = 0; y < H; y += 2) g.drawImage(img, 0, y, W, 2, -lean * (1 - y / H) * 1.6, y, W, 2); // 上ほど後ろへ傾く
    if (k === 1) { g.globalCompositeOperation = "source-atop"; g.fillStyle = "rgba(255,255,255,.75)"; g.fillRect(0, 0, W, H); g.globalCompositeOperation = "source-over"; }
  } else if (kind === "勝ち") {
    const up = [0, 16, 24, 8][k], st = [1, 1.04, 1.06, 1.02][k], h2 = H * st;
    g.drawImage(img, 0, 0, W, H, 0, H - h2 - up, W, h2);
    g.fillStyle = "#ffd166"; for (const [x, y] of [[40, 60], [210, 90], [60, 150], [200, 30]].slice(0, k + 1)) { g.fillRect(x - 2, y - 8, 4, 16); g.fillRect(x - 8, y - 2, 16, 4); }
  } else {
    const sq = [0, 10, 18][k];
    g.drawImage(img, 0, waist, W, H - waist, 0, waist, W, H - waist);
    g.drawImage(img, 0, 0, W, waist, 0, sq, W, waist);                           // 上半身ががくっと沈む
    g.globalCompositeOperation = "source-atop"; g.fillStyle = `rgba(20,24,60,${k * .18})`; g.fillRect(0, 0, W, H); g.globalCompositeOperation = "source-over";
  }
}
(async () => {
  const hands = await Promise.all([0, 1, 2].map(h => load(JQArt.handIcon(h))));
  for (let i = 1; i <= 9; i++) {
    const img = await load(`img/chars/c${i}.png?v=1`);
    const row = document.createElement("div"); row.className = "row"; row.innerHTML = `<b>${NAMES[i - 1]}</b>`;
    for (const [kind, n, ms] of MOTIONS) {
      const c = document.createElement("canvas"); c.width = W; c.height = H;
      const cell = document.createElement("div"); cell.className = "cell"; cell.append(c, kind); row.append(cell);
      const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
      let k = 0; frame(g, img, hands, kind, 0);
      setInterval(() => { k = (k + 1) % n; frame(g, img, hands, kind, k); }, ms);
    }
    document.getElementById("list").append(row);
  }
})();
</script>
</body>
</html>
